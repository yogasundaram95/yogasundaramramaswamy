<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" fill="#0f1117"/>
  <!-- Chart bars -->
  <rect x="60" y="180" width="40" height="80" fill="#3b82f6" opacity="0.4" rx="4"/>
  <rect x="120" y="140" width="40" height="120" fill="#3b82f6" opacity="0.5" rx="4"/>
  <rect x="180" y="100" width="40" height="160" fill="#3b82f6" opacity="0.6" rx="4"/>
  <rect x="240" y="70" width="40" height="190" fill="#3b82f6" opacity="0.75" rx="4"/>
  <rect x="300" y="50" width="40" height="210" fill="#3b82f6" opacity="0.9" rx="4"/>
  <!-- Trend line -->
  <polyline points="80,175 140,135 200,95 260,65 320,45" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.9"/>
  <!-- Dots on line -->
  <circle cx="80" cy="175" r="4" fill="#93c5fd"/>
  <circle cx="140" cy="135" r="4" fill="#93c5fd"/>
  <circle cx="200" cy="95" r="4" fill="#93c5fd"/>
  <circle cx="260" cy="65" r="4" fill="#93c5fd"/>
  <circle cx="320" cy="45" r="4" fill="#93c5fd"/>
  <!-- Axes -->
  <line x1="50" y1="270" x2="360" y2="270" stroke="#374151" stroke-width="1.5"/>
  <line x1="50" y1="270" x2="50" y2="30" stroke="#374151" stroke-width="1.5"/>
  <!-- Conversion badge -->
  <rect x="130" y="20" width="140" height="22" rx="11" fill="#1d4ed8" opacity="0.5"/>
  <text x="200" y="35" text-anchor="middle" fill="#93c5fd" font-size="11" font-family="monospace">Free → Paid +31%</text>
  <!-- Title -->
  <text x="200" y="290" text-anchor="middle" fill="#60a5fa" font-size="11" font-family="monospace">PLG Funnel Analytics</text>
</svg>
