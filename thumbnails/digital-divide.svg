<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Grid lines -->
  <g stroke="#1e2a4a" stroke-width="0.5" opacity="0.5">
    <line x1="80" y1="40" x2="80" y2="380"/>
    <line x1="80" y1="380" x2="760" y2="380"/>
    <line x1="80" y1="312" x2="760" y2="312" stroke-dasharray="4"/>
    <line x1="80" y1="244" x2="760" y2="244" stroke-dasharray="4"/>
    <line x1="80" y1="176" x2="760" y2="176" stroke-dasharray="4"/>
    <line x1="80" y1="108" x2="760" y2="108" stroke-dasharray="4"/>
  </g>
  <!-- Y-axis labels -->
  <text x="70" y="384" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">0</text>
  <text x="70" y="316" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">25</text>
  <text x="70" y="248" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">50</text>
  <text x="70" y="180" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">75</text>
  <text x="70" y="112" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">100</text>
  <!-- Title -->
  <text x="400" y="30" fill="#e0e8f0" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Broadband Speed by County Type (Mbps)</text>
  <!-- Bars - Metro -->
  <rect x="120" y="82" width="80" height="298" fill="#4a90d9" rx="4" opacity="0.9"/>
  <text x="160" y="72" fill="#4a90d9" font-size="13" text-anchor="middle" font-weight="bold" font-family="sans-serif">110</text>
  <text x="160" y="400" fill="#8a9ab0" font-size="11" text-anchor="middle" font-family="sans-serif">Metro</text>
  <!-- Bars - Suburban -->
  <rect x="260" y="150" width="80" height="230" fill="#5bb5a6" rx="4" opacity="0.9"/>
  <text x="300" y="140" fill="#5bb5a6" font-size="13" text-anchor="middle" font-weight="bold" font-family="sans-serif">85</text>
  <text x="300" y="400" fill="#8a9ab0" font-size="11" text-anchor="middle" font-family="sans-serif">Suburban</text>
  <!-- Bars - Small Town -->
  <rect x="400" y="196" width="80" height="184" fill="#e8a84c" rx="4" opacity="0.9"/>
  <text x="440" y="186" fill="#e8a84c" font-size="13" text-anchor="middle" font-weight="bold" font-family="sans-serif">68</text>
  <text x="440" y="400" fill="#8a9ab0" font-size="11" text-anchor="middle" font-family="sans-serif">Small Town</text>
  <!-- Bars - Rural -->
  <rect x="540" y="237" width="80" height="143" fill="#e07050" rx="4" opacity="0.9"/>
  <text x="580" y="227" fill="#e07050" font-size="13" text-anchor="middle" font-weight="bold" font-family="sans-serif">52</text>
  <text x="580" y="400" fill="#8a9ab0" font-size="11" text-anchor="middle" font-family="sans-serif">Rural</text>
  <!-- Bars - Remote -->
  <rect x="680" y="320" width="80" height="60" fill="#d94040" rx="4" opacity="0.9"/>
  <text x="720" y="310" fill="#d94040" font-size="13" text-anchor="middle" font-weight="bold" font-family="sans-serif">18</text>
  <text x="720" y="400" fill="#8a9ab0" font-size="11" text-anchor="middle" font-family="sans-serif">Remote</text>
  <!-- Annotation -->
  <text x="620" y="430" fill="#d94040" font-size="12" text-anchor="middle" font-family="sans-serif" font-style="italic">6x disparity gap</text>
  <line x1="160" y1="420" x2="720" y2="420" stroke="#d94040" stroke-width="1" stroke-dasharray="6" opacity="0.5"/>
  <!-- Y-axis label -->
  <text x="18" y="230" fill="#6a7a9b" font-size="12" text-anchor="middle" font-family="sans-serif" transform="rotate(-90,18,230)">Speed (Mbps)</text>
</svg>
