<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Dashboard header -->
  <rect x="20" y="15" width="760" height="40" rx="6" fill="#1a2240"/>
  <text x="40" y="40" fill="#e0e8f0" font-size="14" font-weight="bold" font-family="sans-serif">Executive KPI Dashboard</text>
  <rect x="650" y="24" width="70" height="22" rx="4" fill="#1e3a2a"/>
  <text x="685" y="39" fill="#5bb5a6" font-size="10" text-anchor="middle" font-family="sans-serif">LIVE</text>
  <circle cx="645" cy="35" r="4" fill="#5bb5a6"/>
  <!-- KPI Cards Row -->
  <!-- Card 1: Revenue -->
  <rect x="20" y="70" width="175" height="90" rx="8" fill="#1a2240" stroke="#2a3a5a" stroke-width="1"/>
  <text x="35" y="92" fill="#6a7a9b" font-size="11" font-family="sans-serif">Total Revenue</text>
  <text x="35" y="120" fill="#e0e8f0" font-size="24" font-weight="bold" font-family="sans-serif">$4.2M</text>
  <text x="35" y="145" fill="#5bb5a6" font-size="11" font-family="sans-serif">+12.5%</text>
  <polygon points="80,145 87,137 94,145" fill="#5bb5a6"/>
  <!-- Card 2: Orders -->
  <rect x="210" y="70" width="175" height="90" rx="8" fill="#1a2240" stroke="#2a3a5a" stroke-width="1"/>
  <text x="225" y="92" fill="#6a7a9b" font-size="11" font-family="sans-serif">Orders Processed</text>
  <text x="225" y="120" fill="#e0e8f0" font-size="24" font-weight="bold" font-family="sans-serif">102K</text>
  <text x="225" y="145" fill="#5bb5a6" font-size="11" font-family="sans-serif">+8.3%</text>
  <polygon points="270,145 277,137 284,145" fill="#5bb5a6"/>
  <!-- Card 3: Accuracy -->
  <rect x="400" y="70" width="175" height="90" rx="8" fill="#1a2240" stroke="#2a3a5a" stroke-width="1"/>
  <text x="415" y="92" fill="#6a7a9b" font-size="11" font-family="sans-serif">Data Accuracy</text>
  <text x="415" y="120" fill="#5bb5a6" font-size="24" font-weight="bold" font-family="sans-serif">99.4%</text>
  <text x="415" y="145" fill="#5bb5a6" font-size="11" font-family="sans-serif">Target: 99%</text>
  <!-- Card 4: Time Saved -->
  <rect x="590" y="70" width="190" height="90" rx="8" fill="#1a2240" stroke="#2a3a5a" stroke-width="1"/>
  <text x="605" y="92" fill="#6a7a9b" font-size="11" font-family="sans-serif">Report Time</text>
  <text x="605" y="120" fill="#e8a84c" font-size="24" font-weight="bold" font-family="sans-serif">25 min</text>
  <text x="605" y="145" fill="#5bb5a6" font-size="11" font-family="sans-serif">was 6 hrs (-93%)</text>
  <!-- Line chart area -->
  <rect x="20" y="175" width="470" height="260" rx="8" fill="#1a2240" stroke="#2a3a5a" stroke-width="1"/>
  <text x="35" y="198" fill="#8a9ab0" font-size="12" font-weight="bold" font-family="sans-serif">Monthly Revenue Trend</text>
  <!-- Grid lines -->
  <g stroke="#2a3a5a" stroke-width="0.5" stroke-dasharray="3">
    <line x1="35" y1="230" x2="475" y2="230"/>
    <line x1="35" y1="280" x2="475" y2="280"/>
    <line x1="35" y1="330" x2="475" y2="330"/>
    <line x1="35" y1="380" x2="475" y2="380"/>
  </g>
  <!-- Revenue line -->
  <path d="M50,370 L90,355 L130,360 L170,340 L210,320 L250,300 L290,310 L330,280 L370,260 L410,240 L450,220"
        stroke="#4a90d9" stroke-width="2.5" fill="none"/>
  <!-- Area fill -->
  <path d="M50,370 L90,355 L130,360 L170,340 L210,320 L250,300 L290,310 L330,280 L370,260 L410,240 L450,220 L450,400 L50,400 Z"
        fill="#4a90d9" opacity="0.1"/>
  <!-- Month labels -->
  <text x="50" y="415" fill="#6a7a9b" font-size="9" font-family="sans-serif">Jan</text>
  <text x="130" y="415" fill="#6a7a9b" font-size="9" font-family="sans-serif">Mar</text>
  <text x="210" y="415" fill="#6a7a9b" font-size="9" font-family="sans-serif">May</text>
  <text x="290" y="415" fill="#6a7a9b" font-size="9" font-family="sans-serif">Jul</text>
  <text x="370" y="415" fill="#6a7a9b" font-size="9" font-family="sans-serif">Sep</text>
  <text x="450" y="415" fill="#6a7a9b" font-size="9" font-family="sans-serif">Nov</text>
  <!-- Donut chart area -->
  <rect x="505" y="175" width="275" height="260" rx="8" fill="#1a2240" stroke="#2a3a5a" stroke-width="1"/>
  <text x="520" y="198" fill="#8a9ab0" font-size="12" font-weight="bold" font-family="sans-serif">Revenue by Region</text>
  <!-- Donut chart -->
  <circle cx="642" cy="310" r="70" fill="none" stroke="#1e2a4a" stroke-width="24"/>
  <circle cx="642" cy="310" r="70" fill="none" stroke="#4a90d9" stroke-width="24"
          stroke-dasharray="154 286" stroke-dashoffset="0"/>
  <circle cx="642" cy="310" r="70" fill="none" stroke="#5bb5a6" stroke-width="24"
          stroke-dasharray="110 330" stroke-dashoffset="-154"/>
  <circle cx="642" cy="310" r="70" fill="none" stroke="#e8a84c" stroke-width="24"
          stroke-dasharray="88 352" stroke-dashoffset="-264"/>
  <circle cx="642" cy="310" r="70" fill="none" stroke="#e07050" stroke-width="24"
          stroke-dasharray="88 352" stroke-dashoffset="-352"/>
  <text x="642" y="306" fill="#e0e8f0" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">$4.2M</text>
  <text x="642" y="322" fill="#6a7a9b" font-size="10" text-anchor="middle" font-family="sans-serif">Total</text>
  <!-- Legend -->
  <rect x="520" y="218" width="10" height="10" rx="2" fill="#4a90d9"/>
  <text x="535" y="228" fill="#8a9ab0" font-size="10" font-family="sans-serif">North 35%</text>
  <rect x="620" y="218" width="10" height="10" rx="2" fill="#5bb5a6"/>
  <text x="635" y="228" fill="#8a9ab0" font-size="10" font-family="sans-serif">South 25%</text>
  <rect x="520" y="236" width="10" height="10" rx="2" fill="#e8a84c"/>
  <text x="535" y="246" fill="#8a9ab0" font-size="10" font-family="sans-serif">East 20%</text>
  <rect x="620" y="236" width="10" height="10" rx="2" fill="#e07050"/>
  <text x="635" y="246" fill="#8a9ab0" font-size="10" font-family="sans-serif">West 20%</text>
</svg>
