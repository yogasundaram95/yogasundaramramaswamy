<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="rocFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a84c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e8a84c" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Title -->
  <text x="400" y="30" fill="#e0e8f0" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">ROC Curve - Credit Risk Classification (AUC = 0.814)</text>
  <!-- Axes -->
  <line x1="100" y1="60" x2="100" y2="390" stroke="#3a4a6a" stroke-width="1.5"/>
  <line x1="100" y1="390" x2="720" y2="390" stroke="#3a4a6a" stroke-width="1.5"/>
  <!-- Grid -->
  <g stroke="#1e2a4a" stroke-width="0.5" opacity="0.4" stroke-dasharray="4">
    <line x1="100" y1="324" x2="720" y2="324"/>
    <line x1="100" y1="258" x2="720" y2="258"/>
    <line x1="100" y1="192" x2="720" y2="192"/>
    <line x1="100" y1="126" x2="720" y2="126"/>
    <line x1="224" y1="60" x2="224" y2="390"/>
    <line x1="348" y1="60" x2="348" y2="390"/>
    <line x1="472" y1="60" x2="472" y2="390"/>
    <line x1="596" y1="60" x2="596" y2="390"/>
  </g>
  <!-- Axis labels -->
  <text x="100" y="408" fill="#6a7a9b" font-size="11" text-anchor="middle" font-family="sans-serif">0.0</text>
  <text x="255" y="408" fill="#6a7a9b" font-size="11" text-anchor="middle" font-family="sans-serif">0.25</text>
  <text x="410" y="408" fill="#6a7a9b" font-size="11" text-anchor="middle" font-family="sans-serif">0.50</text>
  <text x="565" y="408" fill="#6a7a9b" font-size="11" text-anchor="middle" font-family="sans-serif">0.75</text>
  <text x="720" y="408" fill="#6a7a9b" font-size="11" text-anchor="middle" font-family="sans-serif">1.0</text>
  <text x="88" y="394" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">0.0</text>
  <text x="88" y="328" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">0.2</text>
  <text x="88" y="262" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">0.4</text>
  <text x="88" y="196" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">0.6</text>
  <text x="88" y="130" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">0.8</text>
  <text x="88" y="65" fill="#6a7a9b" font-size="11" text-anchor="end" font-family="sans-serif">1.0</text>
  <!-- Axis titles -->
  <text x="410" y="435" fill="#8a9ab0" font-size="13" text-anchor="middle" font-family="sans-serif">False Positive Rate</text>
  <text x="30" y="225" fill="#8a9ab0" font-size="13" text-anchor="middle" font-family="sans-serif" transform="rotate(-90,30,225)">True Positive Rate</text>
  <!-- Diagonal (random classifier) -->
  <line x1="100" y1="390" x2="720" y2="60" stroke="#3a4a6a" stroke-width="1" stroke-dasharray="6"/>
  <text x="500" y="175" fill="#3a4a6a" font-size="11" font-family="sans-serif" transform="rotate(-28,500,175)">Random (AUC = 0.5)</text>
  <!-- ROC curve -->
  <path d="M100,390 Q100,200 180,140 Q260,80 350,72 Q500,62 600,62 L720,60"
        stroke="#e8a84c" stroke-width="3" fill="none"/>
  <!-- Area under curve -->
  <path d="M100,390 Q100,200 180,140 Q260,80 350,72 Q500,62 600,62 L720,60 L720,390 Z"
        fill="url(#rocFill)"/>
  <!-- AUC badge -->
  <rect x="440" y="240" width="180" height="50" rx="10" fill="#1e2a1a" stroke="#e8a84c" stroke-width="1.5" opacity="0.9"/>
  <text x="530" y="262" fill="#e8a84c" font-size="14" text-anchor="middle" font-weight="bold" font-family="sans-serif">AUC = 0.814</text>
  <text x="530" y="280" fill="#8a9ab0" font-size="11" text-anchor="middle" font-family="sans-serif">Neural Network</text>
  <!-- Legend -->
  <line x1="140" y1="440" x2="170" y2="440" stroke="#e8a84c" stroke-width="2.5"/>
  <text x="178" y="444" fill="#8a9ab0" font-size="12" font-family="sans-serif">Decision Tree + Neural Network</text>
  <line x1="420" y1="440" x2="450" y2="440" stroke="#3a4a6a" stroke-width="1" stroke-dasharray="6"/>
  <text x="458" y="444" fill="#6a7a9b" font-size="12" font-family="sans-serif">Random Classifier</text>
</svg>
