name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare an empty Pages deployment
        run: |
          mkdir -p offline
          printf '<!doctype html><title>Not Found</title><h1>404</h1>\n' > offline/404.html
          touch offline/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload empty site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './offline'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy empty site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
